name: hello-world app pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  IMAGE_NAME: hello-world

jobs:

###########################################################
# Python Tests
###########################################################

  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest flake8 black

      - name: Python Compile
        run: |
          python -m compileall app

      - name: Run Unit Tests
        run: |
          pytest || true

      - name: Lint
        run: |
          flake8 app || true

      - name: Format Check
        run: |
          black --check app || true

###########################################################
# Filesystem Security Scan
###########################################################

  filesystem-scan:

    needs: test

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .

###########################################################
# Build Docker Image
###########################################################

  docker:

    needs:
      - filesystem-scan

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:

          context: ./app

          file: ./app/Dockerfile

          push: true

          cache-from: type=gha
          cache-to: type=gha,mode=max

          tags: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/hello-world:${{ github.sha }}
            docker.io/${{ secrets.DOCKER_USERNAME }}/hello-world:latest

###########################################################
# Docker Image Scan
###########################################################

  image-scan:

    needs: docker

    runs-on: ubuntu-latest

    steps:

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docker.io/${{ secrets.DOCKER_USERNAME }}/hello-world:${{ github.sha }}

###########################################################
# Helm Validation
###########################################################

  helm:

    needs: docker

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |

          helm lint hello-world

          helm lint monitoring/prometheus

          helm lint monitoring/grafana

      - name: Render Helm Charts
        run: |

          helm template hello-world ./hello-world >/tmp/app.yaml

          helm template prometheus ./monitoring/prometheus >/tmp/prom.yaml

          helm template grafana ./monitoring/grafana >/tmp/graf.yaml

###########################################################
# Update Helm values.yaml
###########################################################

  update-image-tag:

    needs:
      - docker
      - helm

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Image Tag
        run: |

          sed -i \
          "s/tag:.*/tag: \"${GITHUB_SHA}\"/" \
          hello-world/values.yaml

      - name: Commit Changes

        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add hello-world/values.yaml

          if git diff --cached --quiet
          then
            echo "No Changes"
            exit 0
          fi

          git commit -m "Update image tag [skip ci]"

          git push