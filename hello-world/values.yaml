# -----------------------------------------------------------------------------
# Replica Count
# -----------------------------------------------------------------------------
replicaCount: 2

# -----------------------------------------------------------------------------
# Deployment
# -----------------------------------------------------------------------------
deployment:
  enabled: true

# -----------------------------------------------------------------------------
# Image
# -----------------------------------------------------------------------------
image:
  repository: hello-world
  tag: "v1"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------
service:
  enabled: true
  type: ClusterIP
  port: 8080

tests:
  enabled: false
# -----------------------------------------------------------------------------
# Autoscaling (HPA)
# -----------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

# -----------------------------------------------------------------------------
# Service Account
# -----------------------------------------------------------------------------
serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  annotations: {}

  hosts:
    - host: hello.example.com
      paths:
        - path: /
          pathType: Prefix

  tls: []

# -----------------------------------------------------------------------------
# HTTPRoute (Gateway API)
# -----------------------------------------------------------------------------
httpRoute:
  enabled: false

# -----------------------------------------------------------------------------
# Pod Metadata
# -----------------------------------------------------------------------------
podAnnotations: {}

podLabels: {}

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------
podSecurityContext: {}

securityContext: {}

# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 256Mi

# -----------------------------------------------------------------------------
# Health Checks
# -----------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes: []

volumeMounts: []

# -----------------------------------------------------------------------------
# Scheduling
# -----------------------------------------------------------------------------
nodeSelector: {}

tolerations: []

affinity: {}
