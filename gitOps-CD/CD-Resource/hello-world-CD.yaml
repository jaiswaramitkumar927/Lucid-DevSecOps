apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/jaiswaramitkumar927/lucidity-assignment-workspace.git
    targetRevision: main
    path: hello-world

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
