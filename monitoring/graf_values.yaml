service:
  type: NodePort
  port: 80
  nodePort: 30300

adminUser: admin
adminPassword: admin123

persistence:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    hello-world:
      file: dashboards/hello-world.json

    kubernetes-global:
      file: dashboards/kubernetes-global.json

    kubernetes-cluster:
      file: dashboards/kubernetes-cluster.json
